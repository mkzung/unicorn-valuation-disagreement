# `pytest` with no path collects the untracked working directory too, and errors there on a
# module that is not on the path. That made the bare command — the one CI runs and the one an
# author types — fail on the author's machine and pass on a fresh clone, which is the worst
# way round: the environment where the suite is red is the one where the work happens.
#
# One line fixes both. It is here rather than in a pyproject because this repository ships no
# package and adding one to configure a test runner would be a heavier answer than the question.
[pytest]
testpaths = tests
